  <ellipse cx="288" cy="176" rx="420" ry="320" fill="url(#glow-forecasting-engine)"/>
  <ellipse cx="983.9999999999999" cy="672" rx="380" ry="300" fill="url(#glow-forecasting-engine)" opacity="0.55"/>
  <circle cx="396" cy="226" r="73" fill="none" stroke="url(#g-forecasting-engine)" stroke-width="1.5" opacity="0.172"/>
  <rect x="167" y="204" width="122" height="122" rx="20" fill="url(#g-forecasting-engine)" opacity="0.140" transform="rotate(18.3 167 204)"/>
  <path d="M916 271 l133 0 l-66 133 Z" fill="none" stroke="url(#g-forecasting-engine)" stroke-width="1.5" opacity="0.075"/>
  <circle cx="723" cy="605" r="60" fill="none" stroke="url(#g-forecasting-engine)" stroke-width="1.5" opacity="0.124"/>
  <rect x="1031" y="623" width="118" height="118" rx="20" fill="url(#g-forecasting-engine)" opacity="0.197" transform="rotate(15.6 1031 623)"/>
  <path d="M559 173 l214 0 l-107 214 Z" fill="none" stroke="url(#g-forecasting-engine)" stroke-width="1.5" opacity="0.128"/>
