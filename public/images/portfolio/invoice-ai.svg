<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Invoice Intelligence — AI & Automation case study">
  
  <defs>
    <linearGradient id="g-invoice-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="bg-invoice-ai" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow-invoice-ai" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-invoice-ai" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-invoice-ai)"/>
  <rect width="1200" height="800" fill="url(#grid-invoice-ai)"/>
  <ellipse cx="288" cy="176" rx="420" ry="320" fill="url(#glow-invoice-ai)"/>
  <ellipse cx="983.9999999999999" cy="672" rx="380" ry="300" fill="url(#glow-invoice-ai)" opacity="0.55"/>
  <circle cx="396" cy="273" r="43" fill="none" stroke="url(#g-invoice-ai)" stroke-width="1.5" opacity="0.178"/>
  <rect x="780" y="592" width="204" height="204" rx="20" fill="url(#g-invoice-ai)" opacity="0.127" transform="rotate(-1.3 780 592)"/>
  <path d="M969 507 l73 0 l-36 73 Z" fill="none" stroke="url(#g-invoice-ai)" stroke-width="1.5" opacity="0.071"/>
  <circle cx="678" cy="204" r="105" fill="none" stroke="url(#g-invoice-ai)" stroke-width="1.5" opacity="0.149"/>
  <rect x="1045" y="259" width="96" height="96" rx="20" fill="url(#g-invoice-ai)" opacity="0.147" transform="rotate(-1.9 1045 259)"/>
  <path d="M256 210 l236 0 l-118 236 Z" fill="none" stroke="url(#g-invoice-ai)" stroke-width="1.5" opacity="0.198"/>
  <circle cx="977" cy="655" r="81" fill="none" stroke="url(#g-invoice-ai)" stroke-width="1.5" opacity="0.066"/>

