<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Clinic Platform — Web Platforms case study">
  
  <defs>
    <linearGradient id="g-clinic-platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bg-clinic-platform" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow-clinic-platform" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-clinic-platform" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-clinic-platform)"/>
  <rect width="1200" height="800" fill="url(#grid-clinic-platform)"/>
  <ellipse cx="288" cy="176" rx="420" ry="320" fill="url(#glow-clinic-platform)"/>
  <ellipse cx="983.9999999999999" cy="672" rx="380" ry="300" fill="url(#glow-clinic-platform)" opacity="0.55"/>
  <circle cx="395" cy="652" r="38" fill="none" stroke="url(#g-clinic-platform)" stroke-width="1.5" opacity="0.161"/>
  <rect x="780" y="466" width="148" height="148" rx="20" fill="url(#g-clinic-platform)" opacity="0.167" transform="rotate(17.6 780 466)"/>
  <path d="M810 320 l62 0 l-31 62 Z" fill="none" stroke="url(#g-clinic-platform)" stroke-width="1.5" opacity="0.082"/>
  <circle cx="811" cy="368" r="67" fill="none" stroke="url(#g-clinic-platform)" stroke-width="1.5" opacity="0.075"/>
  <rect x="1003" y="313" width="161" height="161" rx="20" fill="url(#g-clinic-platform)" opacity="0.135" transform="rotate(10.6 1003 313)"/>
  <path d="M246 618 l169 0 l-85 169 Z" fill="none" stroke="url(#g-clinic-platform)" stroke-width="1.5" opacity="0.146"/>
  <circle cx="243" cy="498" r="40" fill="none" stroke="url(#g-clinic-platform)" stroke-width="1.5" opacity="0.090"/>

  <!-- central plate -->
  <rect x="300" y="270" width="600" height="260" rx="28" fill="#212121" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="600" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#6d28d9" opacity="0.9">WEB PLATFORMS</text>
  <text x="600" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f3ffff">Clinic Platform</text>
  <rect x="560" y="452" width="80" height="4" rx="2" fill="url(#g-clinic-platform)"/>
  <text x="600" y="498" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="2" fill="#a0a6a6">PLUTOX TECH</text>
