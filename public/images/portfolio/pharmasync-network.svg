<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="PharmaSync Network — Healthcare case study">
  
  <defs>
    <linearGradient id="g-pharmasync-network" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bg-pharmasync-network" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow-pharmasync-network" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-pharmasync-network" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-pharmasync-network)"/>
  <rect width="1200" height="800" fill="url(#grid-pharmasync-network)"/>
  <ellipse cx="288" cy="176" rx="420" ry="320" fill="url(#glow-pharmasync-network)"/>
  <ellipse cx="983.9999999999999" cy="672" rx="380" ry="300" fill="url(#glow-pharmasync-network)" opacity="0.55"/>
  <circle cx="394" cy="463" r="63" fill="none" stroke="url(#g-pharmasync-network)" stroke-width="1.5" opacity="0.137"/>
  <rect x="168" y="471" width="201" height="201" rx="20" fill="url(#g-pharmasync-network)" opacity="0.061" transform="rotate(16.2 168 471)"/>
  <path d="M599 416 l112 0 l-56 112 Z" fill="none" stroke="url(#g-pharmasync-network)" stroke-width="1.5" opacity="0.097"/>
  <circle cx="989" cy="413" r="80" fill="none" stroke="url(#g-pharmasync-network)" stroke-width="1.5" opacity="0.137"/>
  <rect x="947" y="212" width="247" height="247" rx="20" fill="url(#g-pharmasync-network)" opacity="0.173" transform="rotate(0.5 947 212)"/>
  <path d="M540 469 l80 0 l-40 80 Z" fill="none" stroke="url(#g-pharmasync-network)" stroke-width="1.5" opacity="0.184"/>
  <circle cx="797" cy="463" r="112" fill="none" stroke="url(#g-pharmasync-network)" stroke-width="1.5" opacity="0.175"/>

  <!-- central plate -->
  <rect x="300" y="270" width="600" height="260" rx="28" fill="#212121" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="600" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#8b5cf6" opacity="0.9">HEALTHCARE</text>
  <text x="600" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#f3ffff">PharmaSync Network</text>
  <rect x="560" y="452" width="80" height="4" rx="2" fill="url(#g-pharmasync-network)"/>
  <text x="600" y="498" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="2" fill="#a0a6a6">PLUTOX TECH</text>
</svg>
